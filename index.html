<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Split Log</title>
<style>
:root{--ink:#17130f;--cream:#fff6e6;--bg:#14110d;--t0:#5c3d06;--t1:#a8700c;--t2:#f2b33d;--t3:#f7cd73;--t4:#fbe5b0;--hl:#ff2e63}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.35 'Inter Tight',system-ui,sans-serif}
.mono{font-family:'DM Mono',ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.ar{font-family:Cairo,sans-serif;font-weight:900;direction:rtl}
#app{max-width:520px;margin:0 auto;padding:0 0 130px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hud{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.ticks{display:flex;gap:3px;align-items:flex-end;padding:0 16px;height:16px}
.ticks i{flex:1;height:5px;border-radius:2px;background:color-mix(in srgb,var(--cream) 22%,transparent)}
.ticks i.done{background:color-mix(in srgb,var(--t2) 55%,transparent)}.ticks i.cur{height:14px;background:var(--t2)}
.ticks i.A{--c:#f2b33d}.ticks i.B{--c:#2fb5d9}
.hero{position:relative;margin:10px 12px;border-radius:22px;overflow:hidden;background:var(--t2);color:var(--ink);min-height:430px}
.pat{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:16px 18px 18px}
.big{font-weight:900;font-size:120px;line-height:.82;letter-spacing:-.04em}
.title{font-weight:900;font-size:34px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
.ph{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#000}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph img.b{animation:flip 2.4s steps(1) infinite}
.ph .pl{position:absolute;left:8px;bottom:8px;background:var(--ink);color:var(--t3);border-radius:8px;padding:3px 8px;font:800 10px 'DM Mono',monospace;letter-spacing:.1em}
.ph .pl{display:grid}.ph .pl i{font-style:normal;grid-area:1/1}.ph .pl i.s{animation:flip 2.4s steps(1) infinite reverse}.ph .pl i.e{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.how{margin-top:8px;font-size:13px;color:var(--t0)}.how summary{font-weight:900;cursor:pointer}.how ol{margin:6px 0 0;padding-left:18px}
.cta{display:block;width:100%;background:var(--ink);color:var(--t3);font-weight:900;font-size:22px;letter-spacing:.04em;border-radius:14px;padding:16px;margin-top:12px;text-transform:uppercase}
.cta.alt{background:transparent;border:3px solid var(--ink);color:var(--ink)}
.sec{padding:22px 16px 6px}
.days{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 12px}
.dayt{position:relative;overflow:hidden;border-radius:16px;color:var(--ink);text-align:left;padding:10px;min-height:118px}
.dayt .pat{opacity:.9}.dayt>*:not(.pat){position:relative}
.dayt b{display:block;font-weight:900;font-size:40px;line-height:.9;letter-spacing:-.03em}
.dayt .n{font-weight:800;font-size:13px;line-height:1.05;text-transform:uppercase}
.dayt.next{outline:3px solid var(--cream);outline-offset:2px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px}
.wall div{border-radius:12px;overflow:hidden;background:var(--t3)}
.wall .ph{aspect-ratio:1/1}
.wall span{display:block;font-size:10px;padding:0 6px 6px;color:var(--ink);font-weight:800;text-transform:uppercase;line-height:1.1;min-height:28px}
.card{margin:8px 12px;border-radius:16px;background:#221d17;padding:14px}
.hist summary{list-style:none;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.hist table{width:100%;font-size:13px;margin-top:8px;border-collapse:collapse}.hist td{padding:4px 0;border-top:1px solid #3a322a}
/* workout */
.wtop{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:6px}
.wtop .hud b{font-weight:900;font-size:15px;text-transform:uppercase}
.back{width:40px;height:40px;border-radius:12px;background:#2a241d;font-size:22px;font-weight:900}
.clock{color:var(--t2);font-weight:900;font-variant-numeric:tabular-nums}
.ex{margin:8px 12px;border-radius:22px;overflow:hidden;background:var(--t2);color:var(--ink);position:relative}
.ex .ph{border-radius:0}
.ex .meta{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;z-index:2}
.chip{background:var(--ink);color:var(--t3);border-radius:20px;padding:4px 10px}
.ex .body{position:relative;padding:4px 16px 16px;background:var(--t2)}
.ex .ar{font-size:20px;line-height:1.3;color:var(--t0)}
.last{font-size:13px;font-weight:700;color:var(--t0);margin-top:6px}
.hint{display:inline-block;margin-top:6px;background:var(--ink);color:#7dffa6;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}
.ww{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.ww .lbl{flex:1;font-weight:900;text-transform:uppercase;font-size:13px;line-height:1.1}
.step{width:50px;height:50px;border-radius:14px;background:var(--ink);color:var(--t3);font-size:28px;font-weight:900}
input{font:inherit;font-weight:900;font-size:22px;background:var(--t4);color:var(--ink);border:0;border-radius:12px;height:50px;padding:0 6px;width:100%;text-align:center}
input::placeholder{color:color-mix(in srgb,var(--ink) 35%,transparent);font-weight:700;font-size:16px}
input:focus{outline:3px solid var(--ink)}
.ww input{width:92px}
.set{display:grid;grid-template-columns:62px 1fr 14px 1fr 54px;gap:6px;align-items:center;margin-top:7px}
.tag{font-weight:900;font-size:13px;text-align:center;line-height:1;padding:9px 0;border-radius:10px;background:var(--t3)}
.tag.work{background:var(--ink);color:var(--t2)}.tag.fail{background:var(--hl);color:#fff}
.x{text-align:center;font-weight:900;opacity:.5}
.chk{height:50px;border-radius:12px;background:var(--t3);font-size:24px;font-weight:900;color:var(--t0)}
.set.done .chk{background:var(--ink);color:#7dffa6}.set.done input{background:color-mix(in srgb,var(--t4) 55%,var(--t2))}
.ex.complete .chip.st{background:#1d7a3e;color:#fff}
.dots{display:flex;gap:5px;margin:14px 0 8px}.dot{flex:1;border-radius:10px;padding:8px 0;font-weight:900;font-size:12px;background:var(--t3);color:var(--t0)}
.dot.done{background:var(--ink);color:#7dffa6}.dot.cur{outline:3px solid var(--ink);outline-offset:1px}
.one{background:var(--t3);border-radius:18px;padding:14px}.one.done{background:color-mix(in srgb,#7dffa6 35%,var(--t3))}
.onehd{display:flex;align-items:center;gap:10px}.onehd b{flex:1;font-weight:900;font-size:22px}.onehd .tag{padding:9px 10px}
.lab{font-weight:900;font-size:12px;text-transform:uppercase;margin-top:12px;color:var(--t0)}
.one .ww{margin:4px 0}.one .ww input{flex:1;width:auto;min-width:0;height:64px;font-size:34px}.one .step{width:64px;height:64px;font-size:34px}
.nav{display:flex;gap:8px;margin:10px 12px}
.nav button{flex:1;border-radius:14px;padding:15px;font-weight:900;font-size:17px;text-transform:uppercase;background:#2a241d}
.nav .go{background:var(--t2);color:var(--ink);flex:2}
#timer{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 94%,transparent);display:none;flex-direction:column;justify-content:center;padding:24px}#timer.on{display:flex}#timer .in{flex-direction:column;align-items:stretch!important}#timer .tl{text-align:center}#timer .tv{font-size:120px!important;margin:10px 0 20px}#timer .in>button{padding:18px!important;font-size:20px}#timer .bar{width:100%}
#timer .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
#timer .tl{flex:1}#timer .tv{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--t2)}
#timer button{background:#2a241d;border-radius:12px;padding:12px 12px;font-weight:900}
#timer .sk{background:var(--t2);color:var(--ink)}
#timer .bar{height:5px;background:#2a241d;border-radius:4px;overflow:hidden;max-width:520px;margin:10px auto 0}#timer .bar i{display:block;height:100%;background:var(--t2)}
#timer.ring{background:var(--t2)}#timer.ring .tv,#timer.ring .mono{color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.set-in label{font-size:12px;font-weight:800;color:#b9ad9c}
.set-in input{background:#2f2820;color:var(--cream);font-size:18px;height:44px}
.sm{background:#2f2820;border-radius:12px;padding:10px;font-weight:800;font-size:14px}
.sum{text-align:center;padding:20px}.sum .big{font-size:84px}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer"><div class="in"><div class="tl"><div class="mono" id="tlab">Rest</div><div class="tv" id="tval">0:00</div></div>
<button data-t="-15">−15</button><button data-t="15">+15</button><button class="sk" data-t="x">SKIP REST</button></div><div class="bar"><i id="tbar"></i></div></div>
<script>window.onerror=(m,u,l)=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;background:#c00;color:#fff;padding:10px;font:12px monospace';d.textContent='Error: '+m+' (line '+l+')';document.body.append(d)}</script>
<script>

const AR={'Pec deck fly':'فراشة (بيك دك)','Incline chest press machine':'بنش عالي جهاز','Seated chest press machine':'ضغط صدر جهاز','Rope push-down':'ترايسبس بالحبل','Triceps dips machine':'جهاز ديبس ترايسبس',
'Smith machine incline press':'بنش عالي سميث','High-to-low cable crossover':'كروس أوفر من فوق لتحت','Low-to-high cable fly':'كروس أوفر من تحت لفوق','Overhead cable triceps extension':'ترايسبس خلف الرأس بالكابل','Reverse-grip push-down':'ترايسبس قبضة عكسية',
'Wide-grip lat pull-down':'سحب أمامي واسع','Seated cable row (V-handle)':'سحب أرضي بالمثلث','Chest-supported machine row':'تجديف جهاز مع سند الصدر','Back extension (45° bench)':'ظهر سفلي ٤٥°','Straight-bar cable curl':'بايسبس كابل بالبار','Preacher curl machine':'بايسبس ارتكاز جهاز',
'V-bar lat pull-down':'سحب أمامي بالمثلث','Single-arm seated cable row':'سحب أرضي بذراع واحدة','Straight-arm cable pull-down':'سحب كابل بذراع مفرودة','High cable curl':'بايسبس كابل عالي','Rope hammer cable curl':'بايسبس هامر بالحبل',
'Leg press':'دفع رجلين','Leg extension':'رفرفة أمامي','Seated leg curl':'رفرفة خلفي جالس','Seated calf machine':'سمانة جالس','Shoulder press machine':'ضغط أكتاف جهاز','Cable lateral raise':'رفرفة جانبي كابل','Reverse pec deck':'فراشة عكسي – كتف خلفي',
'Hack squat':'هاك سكوات','Lying leg curl':'رفرفة خلفي نايم','Standing calf raise':'سمانة واقف','Smith machine shoulder press':'ضغط أكتاف سميث','Cable upright row':'سحب عمودي بالكابل','Cable face pull':'فيس بول بالحبل'};
// photos: free-exercise-db (public domain, github.com/yuhonas/free-exercise-db)
const IMG={"Pec deck fly": "Butterfly", "Incline chest press machine": "Leverage_Incline_Chest_Press", "Seated chest press machine": "Leverage_Chest_Press", "Rope push-down": "Triceps_Pushdown_-_Rope_Attachment", "Triceps dips machine": "Dip_Machine", "Low-to-high cable fly": "Low_Cable_Crossover", "Smith machine incline press": "Smith_Machine_Incline_Bench_Press", "High-to-low cable crossover": "Cable_Crossover", "Overhead cable triceps extension": "Cable_Rope_Overhead_Triceps_Extension", "Reverse-grip push-down": "Reverse_Grip_Triceps_Pushdown", "Wide-grip lat pull-down": "Wide-Grip_Lat_Pulldown", "Seated cable row (V-handle)": "Seated_Cable_Rows", "Chest-supported machine row": "Leverage_Iso_Row", "Back extension (45° bench)": "Hyperextensions_Back_Extensions", "Straight-bar cable curl": "Standing_Biceps_Cable_Curl", "Preacher curl machine": "Machine_Preacher_Curls", "V-bar lat pull-down": "V-Bar_Pulldown", "Single-arm seated cable row": "Seated_One-arm_Cable_Pulley_Rows", "Straight-arm cable pull-down": "Straight-Arm_Pulldown", "High cable curl": "High_Cable_Curls", "Rope hammer cable curl": "Cable_Hammer_Curls_-_Rope_Attachment", "Leg extension": "Leg_Extensions", "Leg press": "Leg_Press", "Seated leg curl": "Seated_Leg_Curl", "Seated calf machine": "Seated_Calf_Raise", "Shoulder press machine": "Leverage_Shoulder_Press", "Cable lateral raise": "Cable_Seated_Lateral_Raise", "Reverse pec deck": "Reverse_Machine_Flyes", "Hack squat": "Hack_Squat", "Lying leg curl": "Lying_Leg_Curls", "Standing calf raise": "Standing_Calf_Raises", "Smith machine shoulder press": "Smith_Machine_Overhead_Shoulder_Press", "Cable upright row": "Upright_Cable_Row", "Cable face pull": "Face_Pull", "_cardio": "Walking_Treadmill"};
const HOW={"Pec deck fly": ["Sit on the machine with your back flat on the pad.", "Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.", "Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.", "Return back to the starting position slowly as you inhale until your chest muscles are fully stretched."], "Incline chest press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.", "Press the handles forward by extending through the elbow.", "After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Seated chest press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.", "Your chest and head should be up and your shoulder blades retracted. This will be your starting position.", "Press the handles forward by extending through the elbow.", "After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Rope push-down": ["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).", "Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.", "Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.", "After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step."], "Triceps dips machine": ["Sit securely in a dip machine, select the weight and firmly grasp the handles.", "Now keep your elbows in at your sides in order to place emphasis on the triceps. The elbows should be bent at a 90 degree angle.", "As you contract the triceps, extend your arms downwards as you exhale. Tip: At the bottom of the movement, focus on keeping a little bend in your arms to keep tension on the triceps muscle.", "Now slowly let your arms come back up to the starting position as you inhale."], "Low-to-high cable fly": ["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.", "Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.", "With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.", "Return your arms back to the starting position after a brief pause."], "Smith machine incline press": ["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your upper chest is aligned with the barbell. Using a pronated grip (palms facing forward) that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your upper chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions."], "High-to-low cable crossover": ["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.", "Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.", "Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights."], "Overhead cable triceps extension": ["Attach a rope to the bottom pulley of the pulley machine.", "Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.", "Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.", "Return to the starting position by flexing your triceps as you breathe out."], "Reverse-grip push-down": ["Start by setting a bar attachment (straight or e-z) on a high pulley machine.", "Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.", "Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.", "Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard."], "Wide-grip lat pull-down": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms."], "Seated cable row (V-handle)": ["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.", "Lean over as you keep the natural alignment of your back and grab the V-bar handles.", "With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.", "Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in."], "Chest-supported machine row": ["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.", "Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.", "Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."], "Back extension (45° bench)": ["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.", "Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.", "With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.", "Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back."], "Straight-bar cable curl": ["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.", "While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.", "Slowly begin to bring the curl bar back to starting position as your breathe in.", "Repeat for the recommended amount of repetitions."], "Preacher curl machine": ["Sit down on the Preacher Curl Machine and select the weight.", "Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.", "Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.", "Lower the handles slowly back to the starting position as you inhale."], "V-bar lat pull-down": ["Sit down on a pull-down machine with a V-Bar attached to the top pulley.", "Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.", "Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement."], "Single-arm seated cable row": ["To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.", "Lean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.", "With your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.", "Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard."], "Straight-arm cable pull-down": ["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.", "Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.", "While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.", "While keeping the arms straight, go back to the starting position while breathing in."], "High cable curl": ["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.", "Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.", "Slowly bring back the arms to the starting position.", "Repeat for the recommended amount of repetitions."], "Rope hammer cable curl": ["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.", "Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.", "Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.", "Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary."], "Leg extension": ["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.", "Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.", "Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.", "Repeat for the recommended amount of times."], "Leg press": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.", "As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.", "Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale."], "Seated leg curl": ["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.", "Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.", "As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.", "Slowly return to the starting position as you breathe in."], "Seated calf machine": ["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.", "Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.", "Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.", "Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement."], "Shoulder press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.", "Press the handles upward by extending through the elbow.", "After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Cable lateral raise": ["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.", "Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.", "Bend forward while keeping your back flat and rest your torso on the thighs.", "Have someone give you the single handles attached to the pulleys. Grasp the left pulley with the right hand and the right pulley with the left after you select your weight. The pulleys should run under your knees and your arms will be extended with palms facing each other and a slight bend at the elbows. This will be the starting position."], "Reverse pec deck": ["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.", "In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.", "Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.", "Pause at the rear of the movement, and slowly return the weight to the starting position."], "Hack squat": ["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.", "Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.", "Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).", "Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section)."], "Lying leg curl": ["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.", "Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.", "As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.", "As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."], "Standing calf raise": ["Adjust the padded lever of the calf raise machine to fit your height.", "Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched."], "Smith machine shoulder press": ["To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.", "Once you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.", "Slowly begin to lower the barbell until it is level with your chin while inhaling.", "Then lift the barbell back to the starting position using your shoulders while exhaling."], "Cable upright row": ["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.", "Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.", "Repeat for the recommended amount of repetitions."], "Cable face pull": ["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."], "_cardio": ["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.", "Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]};

};

const HUE={A1:['#5c3d06','#a8700c','#f2b33d','#f7cd73','#fbe5b0'],A2:['#5a2300','#a8480e','#f07a2e','#f6a46b','#fbd0ad'],A3:['#5a1410','#a3271e','#e2483a','#ee7f74','#f7b8b0'],
B1:['#053c4d','#0b7391','#2fb5d9','#78d2ea','#bfeaf6'],B2:['#06413a','#0e7a6c','#22b39e','#6fd3c3','#b6ece3'],B3:['#0d2a5c','#1d4fa3','#3d7fe0','#7ea9ee','#bcd3f7']};
const pal=id=>{const h=HUE[id];return{0:h[0],1:h[1],2:h[2],3:h[3],4:h[4],k:'#17130f',far:`color-mix(in srgb,#17130f 58%,${h[2]})`,hl:'#ff2e63'}};
const ORDER=['A1','A2','A3','B1','B2','B3'],CYCLE=['A1','A2','A3','R','B1','B2','B3','R'];
const key=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function pattern(id,cols,rows,seed,low){
  const h=HUE[id],r=rng(seed||7),c=20;let s='';
  const tone=()=>low?[h[2],h[3],h[2],h[1]][Math.floor(r()*4)]:h[Math.floor(r()*5)];
  for(let y=0;y<rows;y++){let row='';for(let x=-1;x<=cols;x++){const X=x*c,Y=y*c,k=r(),col=tone();
    if(k<.18)row+=`<circle cx="${X+c/2}" cy="${Y+c/2}" r="${c/2}" fill="${col}"/>`;
    else if(k<.32)row+=`<path d="M${X} ${Y+c}A${c/2} ${c/2} 0 0 1 ${X+c} ${Y+c}Z" fill="${col}"/>`;
    else if(k<.44)row+=`<path d="M${X} ${Y}L${X+c} ${Y}A${c} ${c} 0 0 1 ${X} ${Y+c}Z" fill="${col}"/>`;
    else if(k<.54)row+=`<circle cx="${X+c/2}" cy="${Y+c/2}" r="${c/2-1}" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${X+c/2}" cy="${Y+c/2}" r="3" fill="${col}"/>`;
    else if(k<.62)row+=[0,1,2].map(i=>`<circle cx="${X+4+i*6}" cy="${Y+c/2}" r="2" fill="${col}"/>`).join('');
    else if(k<.7)row+=`<rect x="${X}" y="${Y}" width="${c/2}" height="${c/2}" fill="${col}"/><rect x="${X+c/2}" y="${Y+c/2}" width="${c/2}" height="${c/2}" fill="${col}"/>`;}
    s+=`<g class="prow" style="animation-duration:${18+y%3*6}s;animation-direction:${y%2?'reverse':'normal'}">${row}</g>`}
  return`<svg class="pat" viewBox="0 0 ${cols*c} ${rows*c}" preserveAspectRatio="xMidYMid slice"><rect width="100%" height="100%" fill="${h[2]}"/>${s}</svg>`;
}

   <div class="row" style="margin-top:10px"><button class="sm" data-a="export">Export backup</button><button class="sm" data-a="import">Import backup</button></div></div>`;
  collectAnims();
  function dayT(d){return`<button class="dayt ${d===id?'next':''}" data-a="start" data-id="${d}">${pattern(d,4,6,ORDER.indexOf(d)+11,true)}<b>${d}</b><div class="n">${DAYS[d].t}</div><div class="ar" style="font-size:12px">${DAYS[d].ar}</div><div class="mono" style="font-size:9px;margin-top:4px">${lastDate(d)}</div></button>`}
}
function resumeCard(){
  const a=S.active;setTheme(a.day);
  app.innerHTML=`<div class="hud"><span class="mono">Split Log</span><span class="mono">In progress</span></div>
  <div class="hero" style="min-height:0">${pattern(a.day,10,14,5)}<div class="in"><div style="background:var(--t2);border-radius:16px;padding:14px">
   <div class="big">${a.day}</div><div class="title">${DAYS[a.day].t}</div><div class="ar" style="font-size:22px;color:var(--t0)">${DAYS[a.day].ar}</div>
   <button class="cta" data-a="resume">Resume ▶</button><button class="cta alt" data-a="discard">Discard</button></div></div></div>`;
}
function histItem(h){
  const dur=h.end?Math.round((h.end-h.start)/6e4)+' min':'';
  const rows=exList(h.day).map(x=>{const e=h.ex[x.k];if(!e)return'';const s=e.sets.filter(s=>s.done).map(s=>`${s.w||'BW'}×${s.r||'?'}`).join(', ');return s?`<tr><td>${esc(x.n)}</td><td style="text-align:right">${s}</td></tr>`:''}).join('');
  return`<details class="card hist" style="border-left:6px solid ${HUE[h.day][2]}"><summary><span><b style="color:${HUE[h.day][2]};font-weight:900">${h.day}</b> ${DAYS[h.day].t}</span><span class="mono">${fmtD(h.date)} · ${dur}${h.cardio?' · cardio':''}</span></summary><table>${rows}</table>
  <button class="sm" style="margin-top:8px" data-a="del" data-id="${h.id}">Delete</button></details>`;
}

// ---------- Workout ----------
function start(id){
  if(S.active&&!confirm('Discard the workout in progress?'))return;
  const a={day:id,date:today(),start:Date.now(),cardio:false,cur:0,ex:{}};
  for(const x of exList(id)){
    const W=num(S.work[x.k]),L=lastFor(x.k);
    const lw=L&&L.e.sets.find(q=>q.t==='warm'&&q.done);
    a.ex[x.k]={sets:x.sets.map(t=>({t,w:t==='warm'?(lw?lw.w:''):W,r:'',done:false}))};
  }
  S.active=a;save();workout();
}
function workout(){
  const a=S.active,id=a.day,xs=exList(id),N=xs.length+1;setTheme(id);a.cur=Math.min(a.cur||0,N-1);
  const doneIdx=i=>i===0?a.cardio:a.ex[xs[i-1].k].sets.every(s=>s.done);
  const body=a.cur===0?cardioCard(a,N):exCard(xs[a.cur-1],a.ex[xs[a.cur-1].k],a.cur,N,id);
  app.innerHTML=`<div class="wtop"><div class="hud"><button class="back" data-a="home">‹</button><b>${id} · ${DAYS[id].t}</b><span class="clock" id="clock"></span></div>
  <div class="ticks">${Array.from({length:N},(_,i)=>`<i class="${doneIdx(i)?'done':''} ${i===a.cur?'cur':''}" data-a="go" data-i="${i}"></i>`).join('')}</div></div>
  ${body}
  <div class="nav"><button data-a="prev" ${a.cur===0?'style="visibility:hidden"':''}>‹ Prev</button>${a.cur<N-1?`<button class="go" data-a="next">Next ›</button>`:`<button class="go" data-a="finish">Finish ✓</button>`}</div>`;
  tickClock();collectAnims();
}
function cardioCard(a,N){
  return`<div class="ex ${a.cardio?'complete':''}"><div class="meta"><span class="mono chip">01 / ${pad2(N)}</span><span class="mono chip st">${a.cardio?'Done':'Warm-up cardio'}</span></div>
  ${photo('_cardio',false)}<div class="body"><div class="title">Treadmill walk</div><div class="ar">مشي على السير</div>
  <div class="last">${S.settings.cardio} minutes · brisk walk / incline</div>
  <div class="row" style="margin-top:12px"><button class="cta" style="margin:0" data-a="cardioT">${S.settings.cardio}:00 ▶</button><button class="cta ${a.cardio?'':'alt'}" style="margin:0" data-a="cardio">${a.cardio?'Done ✓':'Mark done'}</button></div></div></div>`;
}
function exCard(x,e,i,N,id){
  const L=lastFor(x.k),fail=x.bw;
  let last='First time — pick a weight you can do for 10–12 reps',hint='';
  if(L){last='Last · '+fmtD(L.date)+' · '+L.e.sets.filter(s=>s.done&&s.t!=='warm').map(s=>`${s.w||'BW'}×${s.r||'?'}`).join('  ');
    const fl=L.e.sets.filter(s=>s.t==='fail'&&s.done);if(fl.length===2&&fl.every(s=>+s.r>=12))hint='↑ 12+ reps on both failure sets last time — add weight';}
  const done=e.sets.every(s=>s.done),nd=e.sets.filter(s=>s.done).length;
  return`<div class="ex ${done?'complete':''}" data-k="${x.k}"><div class="meta"><span class="mono chip">${pad2(i+1)} / ${pad2(N)} · ${x.grp}</span><span class="mono chip st">${nd}/${e.sets.length} sets</span></div>
  <div style="padding-top:44px;background:var(--t2)">${photo(x.n)}</div><div class="body"><div class="title" id="xt">${esc(x.n)}</div><div class="ar">${AR[x.n]||''}</div>
  ${HOW[x.n]?`<details class="how"><summary>How to do it</summary><ol>${HOW[x.n].map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details>`:''}
  <div class="last">${esc(last)}</div>${hint?`<div class="hint">${hint}</div>`:''}
  <div class="mono" style="color:var(--t0);margin-top:8px">${x.sets.includes('warm')?'Warm-up · ':''}1 set 10–12 reps · 2 sets to failure · same weight</div>
  ${setBlock(e,fail)}</div></div>`;
}
function curSet(e){if(e.cur!=null&&e.sets[e.cur])return e.cur;const j=e.sets.findIndex(s=>!s.done);return j<0?e.sets.length-1:j}
function setBlock(e,fail){
  const j=curSet(e),s=e.sets[j],all=e.sets.every(s=>s.done);
  return`<div class="dots">${e.sets.map((q,i)=>`<button data-a="pick" data-i="${i}" class="dot ${q.t} ${q.done?'done':''} ${i===j?'cur':''}">${q.done?'✓':LBL[q.t]}</button>`).join('')}</div>
  <div class="one ${s.done?'done':''}" data-i="${j}">
   <div class="onehd"><span class="tag ${s.t}">${LBL[s.t]}</span><b>Set ${j+1} of ${e.sets.length}</b><span class="mono">target ${TGT[s.t]} reps</span></div>
   <div class="lab">Weight (kg)</div>
   <div class="ww"><button class="step" data-a="sw" data-d="-1">−</button><input type="number" inputmode="decimal" data-f="w" value="${s.w}" placeholder="${fail?'BW':'kg'}"><button class="step" data-a="sw" data-d="1">+</button></div>
   <div class="lab">Reps</div>
   <div class="ww"><button class="step" data-a="sr" data-d="-1">−</button><input type="number" inputmode="numeric" data-f="r" value="${s.r}" placeholder="${TGT[s.t]}"><button class="step" data-a="sr" data-d="1">+</button></div>
   <button class="cta" data-a="set">${s.done?'Undo set ✓':'Done — start rest'}</button>
   ${all?'<button class="cta alt" data-a="next">Exercise complete · Next ›</button>':''}
  </div>`;
}
function finish(){
  const a=S.active,n=Object.values(a.ex).flatMap(e=>e.sets).filter(s=>s.done);
  if(!n.length&&!confirm('No sets ticked. Finish anyway?'))return;
  if(!confirm('Finish and save this workout?'))return;
  a.end=Date.now();a.id=a.start;
  for(const[k,e]of Object.entries(a.ex)){const hv=e.sets.filter(s=>s.t!=='warm'&&s.done&&num(s.w)!=='');if(hv.length)S.work[k]=Math.max(...hv.map(s=>+s.w))}
  S.history.push(a);S.active=null;save();stopTimer();releaseWake();
  const vol=n.reduce((t,s)=>t+(+s.w||0)*(+s.r||0),0),min=Math.round((a.end-a.start)/6e4);
  app.innerHTML=`<div class="hero" style="min-height:0">${pattern(a.day,10,20,9)}<div class="in"><div style="background:var(--t2);border-radius:16px;padding:16px" class="sum">
   <div class="mono">${a.day} · ${DAYS[a.day].t} · done</div><div class="big" id="vol">0</div><div class="title">kg lifted</div>
   <div class="row mono" style="margin-top:12px"><span>${n.length} sets</span><span>${min} min</span><span>${a.cardio?'cardio ✓':'no cardio'}</span></div>
   <div class="wall" style="padding:12px 0 0">${exList(a.day).map(x=>`<div style="background:var(--t3);${a.ex[x.k].sets.every(s=>s.done)?'':'opacity:.35;filter:grayscale(1)'}">${photo(x.n,false)}</div>`).join('')}</div>
   <button class="cta" data-a="home">Done</button></div></div></div>`;
  let v=0;const st=performance.now();(function up(t){const k=Math.min(1,(t-st)/900);$('#vol')&&($('#vol').textContent=Math.round(vol*(1-Math.pow(1-k,3))).toLocaleString());if(k<1)requestAnimationFrame(up)})(st);
  window.scrollTo(0,0);
}

// ---------- Events ----------
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;unlockAudio();
  const A=b.dataset.a,card=b.closest('.ex'),a=S.active;
  const go=i=>{a.cur=i;save();workout();window.scrollTo(0,0)};
  if(A==='start'){start(b.dataset.id);window.scrollTo(0,0);wake()}
  else if(A==='resume'){workout();wake()}
  else if(A==='discard'){if(confirm('Discard workout in progress?')){S.active=null;save();home()}}
  else if(A==='home'){home();window.scrollTo(0,0)}
  else if(A==='finish')finish();
  else if(A==='next')go(a.cur+1);else if(A==='prev')go(a.cur-1);else if(A==='go')go(+b.dataset.i);
  else if(A==='cardio'){a.cardio=!a.cardio;save();workout()}
  else if(A==='cardioT')document.activeElement?.blur(),startTimer(S.settings.cardio*60,'Cardio warm-up');
  else if(A==='del'){if(confirm('Delete this workout from history?')){S.history=S.history.filter(h=>String(h.id)!==b.dataset.id);save();home()}}
  else if(A==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='splitlog-'+today()+'.json';l.click()}
  else if(A==='import'){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>f.files[0].text().then(t=>{const d=JSON.parse(t);if(d.history&&confirm('Replace current data with this backup?')){S=d;save();home()}});f.click()}
  else if(A==='pick'){const e=a.ex[card.dataset.k];e.cur=+b.dataset.i;save();workout()}
  else if(A==='sw'||A==='sr'){const e=a.ex[card.dataset.k],s=e.sets[curSet(e)],f=A==='sw'?'w':'r',st=A==='sw'?(+S.settings.round||2.5):1;
    let v=num(s[f]);if(v===''&&f==='r')v=s.t==='warm'?15:(+b.dataset.d>0?7:13);else if(v==='')v=0;s[f]=Math.max(0,v+st*+b.dataset.d);card.querySelector(`.one [data-f=${f}]`).value=s[f];if(f==='w')carry(e,s);save()}
  else if(A==='set'){const e=a.ex[card.dataset.k],j=curSet(e),s=e.sets[j];
    s.done=!s.done;if(s.done&&s.r==='')s.r=s.t==='warm'?15:s.r;
    if(s.done){const nx=e.sets.findIndex(q=>!q.done);e.cur=nx<0?j:nx}else e.cur=j;save();
    if(s.done){document.activeElement?.blur();navigator.vibrate?.(30);const all=e.sets.every(q=>q.done);startTimer(s.t==='warm'?+S.settings.warm:+S.settings.rest,all?'Exercise done · rest, then next':'Rest · next: set '+(e.cur+1))}
    workout()}
});
app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.s){S.settings[t.dataset.s]=+t.value||S.settings[t.dataset.s];save();return}
  const card=t.closest('.ex');if(!card||!S.active||!card.dataset.k)return;const e=S.active.ex[card.dataset.k];
  const s=e.sets[+t.closest('.one').dataset.i];s[t.dataset.f]=num(t.value);if(t.dataset.f==='w')carry(e,s);
  save();
});
app.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')e.target.select()});
function carry(e,s){if(s.t==='warm')return;const i=e.sets.indexOf(s);e.sets.forEach((q,j)=>{if(j>i&&!q.done&&q.t!=='warm')q.w=s.w})}
// swipe between exercises
let sx=null,sy=0;app.addEventListener('touchstart',e=>{if(!S.active||e.target.closest('input,button'))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(sx==null||!S.active)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){const N=exList(S.active.day).length+1,i=S.active.cur+(dx<0?1:-1);if(i>=0&&i<N){S.active.cur=i;save();workout();window.scrollTo(0,0)}}sx=null});

// ---------- Timer / clock / wake ----------
let T={end:0,tot:0,iv:0},actx;
function unlockAudio(){try{actx??=new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.4,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function startTimer(sec,lab){T.end=Date.now()+sec*1e3;T.tot=sec;$('#tlab').textContent=lab;$('#timer').classList.add('on');$('#timer').classList.remove('ring');clearInterval(T.iv);T.iv=setInterval(tick,250);tick()}
function stopTimer(){clearInterval(T.iv);$('#timer').classList.remove('on')}
function tick(){
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1e3));
  $('#tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#tbar').style.width=(100*left/T.tot)+'%';
  if(left<=0){clearInterval(T.iv);if(Date.now()-T.end>3000)return stopTimer(); // rest ran out while the app was in the background
    $('#tval').textContent='GO!';$('#timer').classList.add('ring');navigator.vibrate?.([300,150,300,150,300]);beep();setTimeout(()=>{if(Date.now()>=T.end)stopTimer()},1500)}
}
document.querySelector('#timer').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='x')return stopTimer();T.end+=b.dataset.t*1e3;T.tot=Math.max(T.tot,(T.end-Date.now())/1e3);tick()});
function tickClock(){const c=$('#clock');if(!c||!S.active)return;const m=Math.floor((Date.now()-S.active.start)/6e4);c.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
setInterval(tickClock,15e3);
let lock=null;
async function wake(){try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
function releaseWake(){lock?.release();lock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active)wake();if(T.end&&$('#timer').classList.contains('on'))tick()}});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
S.active?workout():home();
</script>
</body>
</html>

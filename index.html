}
function histItem(h){
  const dur=h.end?Math.round((h.end-h.start)/6e4)+' min':'';
  const rows=exList(h.day,h.sw).map(x=>{const e=h.ex[x.k];if(!e)return'';const s=e.sets.filter(s=>s.done).map(s=>`${s.w||'BW'}×${s.r||'?'}`).join(', ');return s?`<tr><td>${esc(x.n)}</td><td>${s}</td></tr>`:''}).join('');
  return`<details class="hist"><summary><b class="d code">${h.day}</b><span><span class="t">${DAYS[h.day].t}</span><span class="s">${fmtD(h.date)} · ${dur}${h.cardio?' · cardio':''}</span></span></summary><table>${rows}</table>
  <div style="padding:0 14px 12px"><button class="sm" data-a="del" data-id="${h.id}">Delete workout</button></div></details>`;
}


// ---------- Workout ----------
function mkEx(x){const W=num(S.work[x.k]),L=lastFor(x.k),lw=L&&L.e.sets.find(q=>q.t==='warm'&&q.done);
  return{sets:x.sets.map(t=>({t,w:t==='warm'?(lw?lw.w:''):W,r:'',done:false}))}}
function start(id){
  if(S.active&&!confirm('Discard the workout in progress?'))return;
  const a={day:id,date:today(),start:Date.now(),cardio:false,cur:0,ex:{},sw:{...S.pref}};
  for(const x of exList(id,a.sw))a.ex[x.k]=mkEx(x);
  S.active=a;save();workout();
}
function workout(){
  const a=S.active,id=a.day,xs=exList(id,a.sw),N=xs.length+1;a.cur=Math.min(a.cur||0,N-1);
  const doneIdx=i=>i===0?a.cardio:a.ex[xs[i-1].k].sets.every(s=>s.done);
  const body=a.cur===0?cardioCard(a):exCard(xs[a.cur-1],a.ex[xs[a.cur-1].k]);
  app.innerHTML=`<div class="wt"><header class="top"><button class="back" data-a="home" aria-label="Back">‹</button><div class="lbl">${id} · ${a.cur===0?'Warm-up':`Exercise ${a.cur} of ${N-1}`}</div><span class="clock d" id="clock"></span></header>
  <div class="prog">${Array.from({length:N},(_,i)=>`<i class="${doneIdx(i)?'done':''} ${i===a.cur?'cur':''}" data-a="go" data-i="${i}"></i>`).join('')}</div></div>
  ${body}
  <div class="nav"><button class="btn ghost" data-a="prev" ${a.cur===0?'style="visibility:hidden"':''}>‹ Back</button>${a.cur<N-1?`<button class="btn dark" data-a="next">Next exercise ›</button>`:`<button class="btn dark" data-a="finish">Finish workout</button>`}</div>`;
  tickClock();
}
function cardioCard(a){
  return`<article class="card ex">${photo('_cardio',false)}<div class="pad"><div class="lbl">Warm-up</div><h1 class="d">Treadmill walk</h1><div class="ar">مشي على السير</div>
  <div class="last">${S.settings.cardio} minutes, brisk walk or incline.</div>
  <div class="row2"><button class="btn ghost" data-a="cardioT">Start ${S.settings.cardio}:00</button><button class="btn ${a.cardio?'dark':''}" data-a="cardio">${a.cardio?'Done ✓':'Mark done'}</button></div></div></article>`;
}
function exCard(x,e){
  const L=lastFor(x.k);
  let last='<b>First time.</b> Pick a weight you can lift 10–12 times.',hint='';
  if(L){last=`<b>Last time</b> (${fmtD(L.date)}): `+esc(L.e.sets.filter(s=>s.done&&s.t!=='warm').map(s=>`${s.w||'BW'}×${s.r||'?'}`).join(' · '));
    const fl=L.e.sets.filter(s=>s.t==='fail'&&s.done);if(fl.length===2&&fl.every(s=>+s.r>=12))hint='12+ reps on both failure sets last time. Add weight today.';}
  return`<article class="card ex" data-k="${x.k}">${photo(x.n)}<div class="pad">
  <div class="lbl">${x.grp} · ${scheme(x)}</div><h1 class="d" id="xt">${esc(x.n)}</h1><div class="ar">${AR[x.n]||''}</div>
  ${opts(x.n0).length>1?`<button class="link" data-a="opts" data-n0="${esc(x.n0)}" data-ctx="wk" data-id="${S.active.day}">Machine busy or missing? Choose another exercise</button>`:''}
  <div class="last">${last}</div>${hint?`<div class="hint">${hint}</div>`:''}
  ${setBlock(e,x.bw)}
  ${HOW[x.n]?`<details class="how"><summary>How to do it</summary><ol>${HOW[x.n].map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details>`:''}
  </div></article>`;
}
function curSet(e){if(e.cur!=null&&e.sets[e.cur])return e.cur;const j=e.sets.findIndex(s=>!s.done);return j<0?e.sets.length-1:j}
// signature: sets drawn as a pin-loaded weight stack; the pin marks the set you're on
function setBlock(e,bw){
  const j=curSet(e),s=e.sets[j],all=e.sets.every(s=>s.done),rest=s.t==='warm'?S.settings.warm:S.settings.rest;
  return`<div class="stack" role="list">${e.sets.map((q,i)=>`<button role="listitem" class="plate ${q.t} ${q.done?'done':''} ${i===j?'cur':''}" data-a="pick" data-i="${i}" aria-label="${LBL[q.t]} ${i+1}"><span class="pk">${LBL[q.t]}</span><span class="pv">${q.done?`${q.w||'BW'} × ${q.r||'?'}`:`${TGT[q.t]} reps`}</span><span class="hole"></span></button>`).join('')}</div>
  <div class="one" data-i="${j}">
   <div class="lrow"><span class="lbl">Weight<br>kg</span><button class="step" data-a="sw" data-d="-1" aria-label="Less weight">−</button><input type="number" inputmode="decimal" data-f="w" value="${s.w}" placeholder="${bw?'BW':'kg'}"><button class="step" data-a="sw" data-d="1" aria-label="More weight">+</button></div>
   <div class="lrow"><span class="lbl">Reps</span><button class="step" data-a="sr" data-d="-1" aria-label="Fewer reps">−</button><input type="number" inputmode="numeric" data-f="r" value="${s.r}" placeholder="${TGT[s.t]}"><button class="step" data-a="sr" data-d="1" aria-label="More reps">+</button></div>
   <button class="btn" data-a="set">${s.done?'Undo this set':`Log ${LBL[s.t].toLowerCase()} · rest ${rest}s`}</button>
   ${all?'<button class="btn ghost" data-a="next">Exercise done · next ›</button>':''}
  </div>`;
}
function finish(){
  const a=S.active,n=Object.values(a.ex).flatMap(e=>e.sets).filter(s=>s.done);
  if(!n.length&&!confirm('No sets logged. Finish anyway?'))return;
  if(!confirm('Finish and save this workout?'))return;
  a.end=Date.now();a.id=a.start;
  for(const[k,e]of Object.entries(a.ex)){const hv=e.sets.filter(s=>s.t!=='warm'&&s.done&&num(s.w)!=='');if(hv.length)S.work[k]=Math.max(...hv.map(s=>+s.w))}
  for(const x of exList(a.day,a.sw))if(a.ex[x.k]&&a.ex[x.k].sets.some(q=>q.done)){if(x.n!==x.n0)S.pref[x.n0]=x.n;else delete S.pref[x.n0]}
  S.history.push(a);S.active=null;save();stopTimer();releaseWake();
  const vol=n.reduce((t,s)=>t+(+s.w||0)*(+s.r||0),0),min=Math.round((a.end-a.start)/6e4),xs=exList(a.day,a.sw),full=xs.filter(x=>a.ex[x.k].sets.every(s=>s.done)).length;
  app.innerHTML=`<header class="top"><div class="d brand">Split Log</div><div class="lbl">Workout saved</div></header>
  <section class="card pad sum"><div class="lbl">${a.day} · ${DAYS[a.day].t}</div><div class="d big" id="vol">0</div><div class="lbl">kg lifted</div>
   <div class="stats"><div><b class="d">${n.length}</b><span class="lbl">sets</span></div><div><b class="d">${full}/${xs.length}</b><span class="lbl">exercises</span></div><div><b class="d">${min}</b><span class="lbl">minutes</span></div></div>
   <button class="btn" data-a="home">Done</button></section>`;
  const st=performance.now();(function up(t){const k=Math.min(1,(t-st)/900);$('#vol')&&($('#vol').textContent=Math.round(vol*(1-Math.pow(1-k,3))).toLocaleString());if(k<1)requestAnimationFrame(up)})(st);
  window.scrollTo(0,0);
}


// ---------- Events ----------
app.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;unlockAudio();
  const A=b.dataset.a,card=b.closest('.ex'),a=S.active;
  const go=i=>{a.cur=i;save();workout();window.scrollTo(0,0)};
  if(A==='start'){start(b.dataset.id);window.scrollTo(0,0);wake()}
  else if(A==='day'){dayView(b.dataset.id);window.scrollTo(0,0)}
  else if(A==='opts')showOpts(b.dataset.n0,b.dataset.ctx,b.dataset.id);
  else if(A==='closeopts')$('#sheet').remove();
  else if(A==='choose'){const n0=b.dataset.n0,n=b.dataset.n;$('#sheet').remove();
    if(b.dataset.ctx==='day'){if(n===n0)delete S.pref[n0];else S.pref[n0]=n;save();const y=scrollY;dayView(b.dataset.id);scrollTo(0,y)}
    else{a.sw??={};if(n===n0)delete a.sw[n0];else a.sw[n0]=n;const nx=exList(a.day,a.sw).find(x=>x.n0===n0);if(!a.ex[nx.k])a.ex[nx.k]=mkEx(nx);save();workout()}}
  else if(A==='resume'){workout();wake()}
  else if(A==='discard'){if(confirm('Discard workout in progress?')){S.active=null;save();home()}}
  else if(A==='home'){home();window.scrollTo(0,0)}
  else if(A==='finish')finish();
  else if(A==='next')go(a.cur+1);else if(A==='prev')go(a.cur-1);else if(A==='go')go(+b.dataset.i);
  else if(A==='cardio'){a.cardio=!a.cardio;if(a.cardio){stopTimer();a.cur=1;window.scrollTo(0,0)}save();workout()}
  else if(A==='cardioT')document.activeElement?.blur(),startTimer(S.settings.cardio*60,'Cardio warm-up');
  else if(A==='del'){if(confirm('Delete this workout from history?')){S.history=S.history.filter(h=>String(h.id)!==b.dataset.id);save();home()}}
  else if(A==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='splitlog-'+today()+'.json';l.click()}
  else if(A==='import'){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>f.files[0].text().then(t=>{const d=JSON.parse(t);if(d.history&&confirm('Replace current data with this backup?')){S=d;save();home()}});f.click()}
  else if(A==='pick'){const e=a.ex[card.dataset.k];e.cur=+b.dataset.i;save();workout()}
  else if(A==='sw'||A==='sr'){const e=a.ex[card.dataset.k],s=e.sets[curSet(e)],f=A==='sw'?'w':'r',st=A==='sw'?(+S.settings.round||2.5):1;
    let v=num(s[f]);if(v===''&&f==='r')v=s.t==='warm'?15:(+b.dataset.d>0?7:13);else if(v==='')v=0;s[f]=Math.max(0,v+st*+b.dataset.d);card.querySelector(`.one [data-f=${f}]`).value=s[f];if(f==='w')carry(e,s);save()}
  else if(A==='set'){const e=a.ex[card.dataset.k],j=curSet(e),s=e.sets[j];
    s.done=!s.done;if(s.done&&s.r==='')s.r=s.t==='warm'?15:s.r;
    if(s.done){const nx=e.sets.findIndex(q=>!q.done);e.cur=nx<0?j:nx}else e.cur=j;save();
    if(s.done){document.activeElement?.blur();navigator.vibrate?.(30);const all=e.sets.every(q=>q.done);startTimer(s.t==='warm'?+S.settings.warm:+S.settings.rest,all?'Exercise done · rest, then next':'Rest · next: set '+(e.cur+1))}
    workout()}
});
app.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.s){S.settings[t.dataset.s]=+t.value||S.settings[t.dataset.s];save();return}
  const card=t.closest('.ex');if(!card||!S.active||!card.dataset.k)return;const e=S.active.ex[card.dataset.k];
  const s=e.sets[+t.closest('.one').dataset.i];s[t.dataset.f]=num(t.value);if(t.dataset.f==='w')carry(e,s);
  save();
});
app.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')e.target.select()});
function carry(e,s){if(s.t==='warm')return;const i=e.sets.indexOf(s);e.sets.forEach((q,j)=>{if(j>i&&!q.done&&q.t!=='warm')q.w=s.w})}
// swipe between exercises
let sx=null,sy=0;app.addEventListener('touchstart',e=>{if(!S.active||e.target.closest('input,button'))return sx=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
app.addEventListener('touchend',e=>{if(sx==null||!S.active)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){const N=exList(S.active.day,S.active.sw).length+1,i=S.active.cur+(dx<0?1:-1);if(i>=0&&i<N){S.active.cur=i;save();workout();window.scrollTo(0,0)}}sx=null});

// ---------- Timer / clock / wake ----------
let T={end:0,tot:0,iv:0},actx;
function unlockAudio(){try{actx??=new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function beep(){try{[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.4,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function startTimer(sec,lab){T.end=Date.now()+sec*1e3;T.tot=sec;$('#tlab').textContent=lab;$('#timer').classList.add('on');$('#timer').classList.remove('ring');clearInterval(T.iv);T.iv=setInterval(tick,250);tick()}
function stopTimer(){clearInterval(T.iv);$('#timer').classList.remove('on')}
function tick(){
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1e3));
  $('#tval').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');$('#tbar').style.width=(100*left/T.tot)+'%';
  if(left<=0){clearInterval(T.iv);if(Date.now()-T.end>3000)return stopTimer(); // rest ran out while the app was in the background
    $('#tval').textContent='GO!';$('#timer').classList.add('ring');navigator.vibrate?.([300,150,300,150,300]);beep();setTimeout(()=>{if(Date.now()>=T.end)stopTimer()},1500)}
}
document.querySelector('#timer').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='x')return stopTimer();T.end+=b.dataset.t*1e3;T.tot=Math.max(T.tot,(T.end-Date.now())/1e3);tick()});
function tickClock(){const c=$('#clock');if(!c||!S.active)return;const m=Math.floor((Date.now()-S.active.start)/6e4);c.textContent=Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
setInterval(tickClock,15e3);
let lock=null;
async function wake(){try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
function releaseWake(){lock?.release();lock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active)wake();if(T.end&&$('#timer').classList.contains('on'))tick()}});

// a workout started under an older set scheme gets rebuilt to the current one (keeps finished sets that still fit)
if(S.active&&DAYS[S.active.day]){for(const x of exList(S.active.day,S.active.sw)){const e=S.active.ex[x.k];if(e&&e.sets.map(q=>q.t).join()===x.sets.join())continue;
  const old=e?e.sets:[],ws=old.filter(q=>q.t!=='warm'&&num(q.w)!=='').map(q=>+q.w),w=ws.length?Math.max(...ws):num(S.work[x.k]);
  S.active.ex[x.k]={sets:x.sets.map((t,i)=>old[i]&&old[i].t===t?old[i]:{t,w:t==='warm'?'':w,r:'',done:false})}}save()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
S.active?workout():home();
</script>
</body>
</html>

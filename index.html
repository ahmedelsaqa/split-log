<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E4E6E9">
<link rel="manifest" href="manifest.webmanifest">

<title>Split Log</title>
<style>
/* Split Log — "pin-loaded" system. steel = floor, chalk = cards, graphite = plates/ink, pin = the one accent */
:root{--steel:#E4E6E9;--chalk:#F7F7F5;--ink:#1D2026;--plate:#2B2F37;--iron:#5B616B;--rule:#CDD1D6;--pin:#F2C230;--fail:#D8432B;--ok:#2E7D4F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--steel);color:var(--ink);font:400 15px/1.4 'Inter Tight',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:0 14px 120px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.d{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--iron)}
.ar{font-family:Cairo,sans-serif;font-weight:700;direction:rtl;text-align:right;color:var(--iron)}
h1.d{font-size:34px;margin:4px 0 2px}h2.sec{margin:26px 2px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px 10px}
.brand{font-size:26px}
.back{width:44px;height:44px;border-radius:12px;background:var(--chalk);border:1px solid var(--rule);font-size:24px;font-weight:600;line-height:1}
.card{background:var(--chalk);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.pad{padding:14px 16px 16px}
.meta{font-size:13px;color:var(--iron);margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:12px;background:var(--pin);color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;border:2px solid var(--ink)}
.btn.dark{background:var(--ink);color:var(--chalk)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* 8-day cycle strip: each cell is a real day of the rotation */
.cycle{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:12px}
.cycle i{font-style:normal;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:13px;padding:7px 0;border-radius:8px;background:var(--chalk);border:1px solid var(--rule);color:var(--iron)}
.cycle i.rest{background:transparent;border-style:dashed}
.cycle i.past{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.cycle i.now{background:var(--pin);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* photo: start/end frames alternate */
.ph{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;background:#111}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph img.b{animation:flip 2.4s steps(1) infinite}
.ph .pl{position:absolute;left:10px;bottom:10px;display:grid;background:rgba(29,32,38,.85);color:var(--chalk);border-radius:6px;padding:3px 8px;font:700 12px 'Barlow Condensed';letter-spacing:.12em}
.ph .pl i{font-style:normal;grid-area:1/1}.ph .pl i.s{animation:flip 2.4s steps(1) infinite reverse}.ph .pl i.e{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ph img.b,.ph .pl i{animation:none}.ph .pl i.e{opacity:0}}
/* lists */
.list>*+*{border-top:1px solid var(--rule)}
.drow{display:grid;grid-template-columns:52px 1fr 20px;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.drow .code{font-size:26px}.drow.next .code{background:var(--pin);border-radius:8px;text-align:center;padding:4px 0}
.t{display:block;font-weight:600;font-size:15px}.s{display:block;font-size:13px;color:var(--iron)}
.chev{font-size:22px;color:var(--iron)}
.xrow{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;align-items:center}
.xrow .ph{border-radius:10px;aspect-ratio:4/3}.xrow .ar{font-size:13px}
.swapb{margin-top:6px;padding:6px 10px;font-size:13px;text-align:left}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--steel) 30%)}
.dock .btn{max-width:492px;margin:0 auto}
/* workout */
.wt{position:sticky;top:0;z-index:5;background:var(--steel)}
.clock{font-size:22px;min-width:44px;text-align:right}
.prog{display:flex;gap:3px;margin:0 0 12px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--rule);cursor:pointer}
.prog i.done{background:var(--ink)}.prog i.cur{background:var(--pin);box-shadow:0 0 0 1px var(--ink)}
.link{margin-top:10px;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-align:left;padding:4px 0}
.last{margin-top:10px;font-size:14px}.last b{font-weight:600}
.hint{margin-top:8px;display:inline-block;background:var(--ok);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
/* signature: the set list is a pin-loaded weight stack */
.stack{position:relative;margin:16px 0 14px;padding:6px;background:var(--ink);border-radius:12px}
.stack::before{content:'';position:absolute;top:0;bottom:0;right:28px;width:4px;background:#3A3F49}
.plate{position:relative;display:grid;grid-template-columns:86px 1fr 34px;align-items:center;width:100%;height:46px;margin:4px 0;padding:0 0 0 12px;border-radius:6px;background:var(--plate);color:#AEB4BE;text-align:left;border-left:4px solid #3A3F49}
.plate .pk{font:700 14px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase}
.plate .pv{font:800 20px 'Barlow Condensed';color:var(--chalk)}
.plate .hole{position:relative;justify-self:center;width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 2px #444a55}
.plate.fail{border-left-color:var(--fail)}.plate.fail .pk{color:#F08A78}
.plate.done .pv::after{content:'  \2713';color:var(--pin)}
.plate:not(.done) .pv{color:#7F8692;font-weight:700;font-size:17px}
.plate.cur{background:#3A3F49;color:var(--chalk)}
.plate.cur .hole{background:var(--pin);box-shadow:0 0 0 3px var(--ink)}
.plate.cur .hole::after{content:'';position:absolute;left:10px;top:50%;width:16px;height:6px;margin-top:-3px;border-radius:3px;background:var(--pin)}
/* logger */
.one{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:70px 60px 1fr 60px;gap:8px;align-items:center}
.step{height:60px;border-radius:12px;background:var(--ink);color:var(--chalk);font-size:30px;font-weight:600}
input{font:800 30px 'Barlow Condensed',sans-serif;height:60px;width:100%;min-width:0;border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);text-align:center}
input::placeholder{color:#A8AEB7;font-weight:700;font-size:20px}
input:focus{outline:none;border-color:var(--ink)}
.how{margin-top:16px;font-size:14px}.how summary{font-weight:600;cursor:pointer;padding:6px 0}.how ol{margin:6px 0 0;padding-left:20px;color:var(--iron)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.nav .btn.ghost{font-size:18px}
/* rest timer */
#timer{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--chalk);display:none;align-items:center;justify-content:center;padding:24px}
#timer.on{display:flex}#timer .in{width:100%;max-width:440px;text-align:center}
#timer .lbl{color:#AEB4BE;font-size:15px}
#timer .tv{font:800 150px/1 'Barlow Condensed';color:var(--pin);font-variant-numeric:tabular-nums;margin:8px 0 14px}
#timer .bar{height:6px;background:#3A3F49;border-radius:3px;overflow:hidden;margin-bottom:20px}#timer .bar i{display:block;height:100%;background:var(--pin)}
#timer .tb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
#timer .tb button{height:52px;border-radius:12px;background:#2B2F37;font:700 18px 'Barlow Condensed';letter-spacing:.06em}
#timer.ring{background:var(--pin)}#timer.ring .tv,#timer.ring .lbl{color:var(--ink)}
/* exercise picker sheet */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(29,32,38,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--steel);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.optlist{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:110px 1fr 24px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--chalk);border:2px solid var(--rule);border-radius:14px;padding:8px}
.opt .ph{border-radius:10px;aspect-ratio:4/3}.opt .ar{font-size:13px}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.opt .ck{font:800 22px 'Barlow Condensed';background:var(--pin);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.opt:disabled{opacity:.45}
/* history, settings, summary */
.hist summary{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.hist summary .code{font-size:24px}.hist table{width:calc(100% - 28px);margin:0 14px 10px;font-size:13px;border-collapse:collapse}.hist td{padding:5px 0;border-top:1px solid var(--rule)}.hist td+td{text-align:right;font-weight:600}
.sm{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.settings summary{padding:14px 16px;font-weight:600;cursor:pointer}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.grid4 label{font-size:13px;color:var(--iron)}.grid4 input{height:48px;font-size:22px;margin-top:4px}
.empty{padding:16px;color:var(--iron)}
.sum{text-align:center}.sum .big{font-size:96px;margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats div{padding:12px 0}.stats b{display:block;font-size:30px}.stats div+div{border-left:1px solid var(--rule)}
</style>
</head>

bell_Calf_Raise", "Machine military press": "Machine_Shoulder_Military_Press", "Seated cable shoulder press": "Seated_Cable_Shoulder_Press", "Dumbbell shoulder press": "Dumbbell_Shoulder_Press", "Smith machine upright row": "Smith_Machine_Upright_Row", "Dumbbell lateral raise": "Side_Lateral_Raise", "Cable lateral raise (two-handle)": "Cable_Seated_Lateral_Raise", "Cable rear delt fly": "Cable_Rear_Delt_Fly", "Dumbbell rear delt raise": "Seated_Bent-Over_Rear_Delt_Raise", "Floor crunch": "Crunches", "Standing rope crunch": "Standing_Rope_Crunch", "Flat bench leg raise": "Flat_Bench_Lying_Leg_Raise", "Hanging leg raise": "Hanging_Leg_Raise", "Oblique crunch": "Oblique_Crunches", "Cable Russian twist": "Cable_Russian_Twists"};
const HOW={"Pec deck fly": ["Sit on the machine with your back flat on the pad.", "Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.", "Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.", "Return back to the starting position slowly as you inhale until your chest muscles are fully stretched."], "Incline chest press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.", "Press the handles forward by extending through the elbow.", "After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Seated chest press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom or middle of the pectorals at the beginning of the motion.", "Your chest and head should be up and your shoulder blades retracted. This will be your starting position.", "Press the handles forward by extending through the elbow.", "After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Rope push-down": ["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).", "Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.", "Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.", "After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step."], "Triceps dips machine": ["Sit securely in a dip machine, select the weight and firmly grasp the handles.", "Now keep your elbows in at your sides in order to place emphasis on the triceps. The elbows should be bent at a 90 degree angle.", "As you contract the triceps, extend your arms downwards as you exhale. Tip: At the bottom of the movement, focus on keeping a little bend in your arms to keep tension on the triceps muscle.", "Now slowly let your arms come back up to the starting position as you inhale."], "Smith machine incline press": ["Place an incline bench underneath the smith machine. Place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the incline bench and make sure your upper chest is aligned with the barbell. Using a pronated grip (palms facing forward) that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your upper chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions."], "Overhead cable triceps extension": ["Attach a rope to the bottom pulley of the pulley machine.", "Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.", "Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.", "Return to the starting position by flexing your triceps as you breathe out."], "Reverse-grip push-down": ["Start by setting a bar attachment (straight or e-z) on a high pulley machine.", "Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.", "Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.", "Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard."], "Wide-grip lat pull-down": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms."], "Seated cable row (V-handle)": ["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.", "Lean over as you keep the natural alignment of your back and grab the V-bar handles.", "With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.", "Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in."], "Chest-supported machine row": ["Load an appropriate weight onto the pins and adjust the seat height so that the handles are at chest level. Grasp the handles with either a neutral or pronated grip. This will be your starting position.", "Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.", "Pause at the bottom of the motion, and then slowly return the handles to the starting position. For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."], "Back extension (45° bench)": ["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.", "Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.", "With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.", "Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back."], "Straight-bar cable curl": ["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.", "While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.", "Slowly begin to bring the curl bar back to starting position as your breathe in.", "Repeat for the recommended amount of repetitions."], "Preacher curl machine": ["Sit down on the Preacher Curl Machine and select the weight.", "Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.", "Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.", "Lower the handles slowly back to the starting position as you inhale."], "V-bar lat pull-down": ["Sit down on a pull-down machine with a V-Bar attached to the top pulley.", "Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.", "Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement."], "Single-arm seated cable row": ["To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.", "Lean over as you keep the natural alignment of your back and grab the single handle attachment with your left arm using a palms-down grip.", "With your arm extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lat as you hold the bar in front of you. The right arm can be kept by the waist. This is the starting position of the exercise.", "Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it as you rotate the wrist, so that by the time your hand is by your abdominals it is in a neutral position (palms facing the torso). Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard."], "Straight-arm cable pull-down": ["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.", "Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.", "While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.", "While keeping the arms straight, go back to the starting position while breathing in."], "High cable curl": ["Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. This will be your starting position.", "Curl the handles towards you until they are next to your ears. Make sure that as you do so you flex your biceps and exhale. The upper arms should remain stationary and only the forearms should move. Hold for a second in the contracted position as you squeeze the biceps.", "Slowly bring back the arms to the starting position.", "Repeat for the recommended amount of repetitions."], "Rope hammer cable curl": ["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.", "Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.", "Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.", "Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary."], "Leg extension": ["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.", "Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.", "Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.", "Repeat for the recommended amount of times."], "Leg press": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.", "As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.", "Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale."], "Seated leg curl": ["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.", "Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.", "As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.", "Slowly return to the starting position as you breathe in."], "Seated calf machine": ["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.", "Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.", "Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.", "Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement."], "Shoulder press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the shoulders at the beginning of the motion. Your chest and head should be up and handles held with a pronated grip. This will be your starting position.", "Press the handles upward by extending through the elbow.", "After a brief pause at the top, return the weight to just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Reverse pec deck": ["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.", "In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.", "Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.", "Pause at the rear of the movement, and slowly return the weight to the starting position."], "Hack squat": ["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.", "Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.", "Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).", "Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section)."], "Lying leg curl": ["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.", "Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.", "As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.", "As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."], "Standing calf raise": ["Adjust the padded lever of the calf raise machine to fit your height.", "Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched."], "Smith machine shoulder press": ["To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.", "Once you have the correct height, sit slightly in behind the barbell so that there is an imaginary straight line from the tip of your nose to the barbell. Your feet should be stationary. Grab the barbell with the palms facing forward, unlock it and lift it up so that your arms are fully extended. This is the starting position.", "Slowly begin to lower the barbell until it is level with your chin while inhaling.", "Then lift the barbell back to the starting position using your shoulders while exhaling."], "Cable upright row": ["Grasp a straight bar cable attachment that is attached to a low pulley with a pronated (palms facing your thighs) grip that is slightly less than shoulder width. The bar should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight. This will be your starting position.", "Use your side shoulders to lift the cable bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.", "Repeat for the recommended amount of repetitions."], "Cable face pull": ["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."], "_cardio": ["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.", "Treadmills offer convenience, cardiovascular benefits, and usually have less impact than walking outside. When walking, you should move at a moderate to fast pace, not a leisurely one. Being an activity of lower intensity, walking doesn't burn as many calories as some other activities, but still provides great benefit. A 150 lb person will burn about 175 calories walking 4 miles per hour for 30 minutes, compared to 450 calories running twice as fast. Maintain proper posture as you walk, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."], "Single-arm cable lateral raise": ["Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you. Your right hand should grab the machine for better support and balance.", "Make sure that your back is erect and your feet are shoulder width apart from each other. This is the starting position.", "Begin to use the left hand and come across your body out until it is elevated to shoulder height while exhaling.", "Feel the contraction at the top for a second and begin to slowly lower the handle back down to the original starting position while inhaling."], "Machine bench press": ["Sit down on the Chest Press Machine and select the weight.", "Step on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.", "Grab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.", "Now bring the handles back towards you as you breathe in."], "Decline chest press machine": ["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the bottom of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.", "Press the handles forward by extending through the elbow.", "After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."], "Smith machine bench press": ["Place a flat bench underneath the smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.", "As you breathe in, come down slowly until you feel the bar on your middle chest.", "After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.", "Repeat the movement for the prescribed amount of repetitions."], "Smith machine squat": ["To begin, first set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.", "Hold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.", "Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).", "Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly."], "Smith machine stiff-leg deadlift": ["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.", "Lift the bar up by fully extending your arms while keeping your back straight. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.", "Keeping the knees stationary, lower the barbell to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement", "Start bringing your torso up straight again as soon as you feel the hamstrings stretch by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement."], "Calf press on leg press": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.", "Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.", "Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched."], "Smith machine calf raise": ["Place a block or weight plate below the bar on the Smith machine. Set the bar to a position that best matches your height. Once the correct height is chosen and the bar is loaded, step onto the plates with the balls of your feet and place the bar on the back of your shoulders.", "Take the bar with both hands facing forward. Rotate the bar to unrack it. This will be your starting position.", "Raise your heels as high as possible by pushing off of the balls of your feet, flexing your calf at the top of the contraction. Your knees should remain extended. Hold the contracted position for a second before you start to go back down.", "Return slowly to the starting position as you breathe in while lowering your heels."], "Ab crunch machine": ["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.", "At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.", "After a second pause, slowly return to the starting position as you breathe in.", "Repeat the movement for the prescribed amount of repetitions."], "Captain's chair knee raise": ["Position your body on the vertical leg raise bench so that your forearms are resting on the pads next to the torso and holding on to the handles. Your arms will be bent at a 90 degree angle.", "The torso should be straight with the lower back pressed against the pad of the machine and the legs extended pointing towards the floor. This will be your starting position.", "Now as you breathe out, lift your legs up as you keep them extended. Continue this movement until your legs are roughly parallel to the floor and then hold the contraction for a second. Tip: Do not use any momentum or swinging as you perform this exercise.", "Slowly go back to the starting position as you breathe in."], "Cable crunch": ["Kneel below a high pulley that contains a rope attachment.", "Grasp cable rope attachment and lower the rope until your hands are placed next to your face.", "Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.", "With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second."], "Cable wood chop": ["Connect a standard handle to a tower, and move the cable to the highest pulley position.", "With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.", "With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.", "In one motion, pull the handle down and across your body to your front knee while rotating your torso."], "Decline crunch": ["Secure your legs at the end of the decline bench and lie down.", "Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.", "While pushing the small of your back down in the bench to better isolate your abdominal muscles, begin to roll your shoulders off it.", "Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the bench only about four inches, and your lower back should remain on the bench. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum."], "Pallof press": ["Connect a standard handle to a tower, andâ€”if possibleâ€”position the cable to shoulder height. If not, a low pulley will suffice.", "With your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.", "With your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.", "Press the cable away from your chest, fully extending both arms. You core should be tight and engaged."], "Reverse crunch": ["Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.", "Move your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.", "While inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.", "Hold the contraction for a second and move your legs back to the starting position while exhaling."], "Reverse cable curl": ["Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso. This will be your starting position.", "While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.", "Slowly begin to bring the bar back to starting position as your breathe in.", "Repeat for the recommended amount of repetitions."], "Cable wrist curl": ["Start out by placing a flat bench in front of a low pulley cable that has a straight bar attachment.", "Use your arms to grab the cable bar with a narrow to shoulder width supinated grip (palms up) and bring them up so that your forearms are resting against the top of your thighs. Your wrists should be hanging just beyond your knees.", "Start out by curling your wrist upwards and exhaling. Keep the contraction for a second.", "Slowly lower your wrists back down to the starting position while inhaling."], "Cable chest press": ["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.", "Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.", "After pausing at full extension, return to th starting position, keeping tension on the cables.", "You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."], "Dumbbell bench press": ["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.", "Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.", "Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it."], "Incline cable chest press": ["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.", "Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.", "After pausing at full extension, return to the starting position, keeping tension on the cables."], "Incline dumbbell press": ["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.", "Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.", "Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.", "Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest."], "Cable crossover": ["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.", "Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.", "Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights."], "Low cable crossover": ["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.", "Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.", "With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.", "Return your arms back to the starting position after a brief pause."], "Dumbbell flyes": ["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.", "Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.", "With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.", "Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights."], "Flat bench cable flyes": ["Position a flat bench between two low pulleys so that when you are laying on it, your chest will be lined up with the cable pulleys.", "Lay flat on the bench and keep your feet on the ground.", "Have someone hand you the handles on each hand. You will grab each single handle attachment with a palms up grip.", "Extend your arms by your side with a slight bend on your elbows. Tip: You will keep this bend constant through the whole movement. Your arms should be parallel to the floor. This is your starting position."], "Smith machine decline press": ["Position a decline bench in the rack so that the bar will be above your chest. Load an appropriate weight and take your place on the bench.", "Rotate the bar to unhook it from the rack and fully extend your arms. Your back should be slightly arched and your shoulder blades retracted. This will be your starting position.", "Begin the movement by flexing your arms, lowering the bar to your chest.", "Pause briefly, and then extend your arms to push the weight back to the starting position."], "Chest dips": ["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.", "While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.", "Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second.", "Repeat the movement for the prescribed amount of repetitions."], "V-bar push-down": ["Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.", "Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. The thumbs should be higher than the small finger. This is your starting position.", "Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.", "After a second hold at the contracted position, bring the V-Bar slowly up to the starting point. Breathe in as you perform this step."], "Straight-bar push-down": ["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.", "Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.", "Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.", "After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step."], "Machine triceps extension": ["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.", "Perform the movement by extending the elbow, pulling your lower arm away from your upper arm.", "Pause at the completion of the movement, and then slowly return the weight to the starting position.", "Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."], "Dumbbell overhead extension": ["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.", "The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.", "Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.", "Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step."], "Close-grip lat pull-down": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.", "As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms."], "Underhand lat pull-down": ["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.", "Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.", "As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.", "As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar."], "Rope straight-arm pull-down": ["Attach a rope to a high pulley and make your weight selection. Stand a couple feet back from the pulley with your feet staggered and take the rope with both hands. Lean forward from the hip, keeping your back straight, with your arms extended up in front of you. This will be your starting position.", "Keeping your arms straight, extend the shoulder to pull the rope down to your thighs.", "Pause at the bottom of the motion, squeezing your lats.", "Return to the starting position without allowing the weight to fully rest on the stack."], "One-arm lat pull-down": ["Select an appropriate weight and adjust the knee pad to help keep you down. Grasp the handle with a pronated grip. This will be your starting position.", "Pull the handle down, squeezing your elbow to your side as you flex the elbow.", "Pause at the bottom of the motion, and then slowly return the handle to the starting position.", "For multiple repetitions, avoid completely returning the weight to keep tension on the muscles being worked."], "Smith machine bent-over row": ["Set the barbell attached to the smith machine to a height that is about 2 inches below your knees.", "Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up.", "Now grasp the barbell using an overhand (pronated) grip and unlock it from the smith machine rack. Then let it hang directly in front of you as your arms hang extended perpendicular to the floor and your torso. This is your starting position.", "While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second."], "One-arm dumbbell row": ["Choose a flat bench and place a dumbbell on each side of it.", "Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.", "Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.", "Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms."], "High row machine": ["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.", "Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.", "Pause at the bottom of the motion, and then slowly return the handles to the starting position.", "For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."], "Reverse hyperextension": ["Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position.", "To begin the movement, flex the hips, pulling the legs forward.", "Reverse the motion by extending the hips, kicking the leg back. It is very important not to over-extend the hip on this movement, stopping short of your full range of motion.", "Return by again flexing the hip, pulling the carriage forward as far as you can."], "Cable preacher curl": ["Place a preacher bench about 2 feet in front of a pulley machine.", "Attach a straight bar to the low pulley.", "Sit at the preacher bench with your elbow and upper arms firmly on top of the bench pad and have someone hand you the bar from the low pulley.", "Grab the bar and fully extend your arms on top of the preacher bench pad. This will be your starting position."], "Machine biceps curl": ["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.", "Perform the movement by flexing the elbow, pulling your lower arm towards your upper arm.", "Pause at the top of the movement, and then slowly return the weight to the starting position.", "Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."], "Dumbbell curl": ["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.", "Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.", "Then, inhale and slowly begin to lower the dumbbells back to the starting position.", "Repeat for the recommended amount of repetitions."], "Dumbbell hammer curl": ["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.", "The palms of the hands should be facing your torso. This will be your starting position.", "Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.", "After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position."], "Dumbbell wrist curl": ["Start out by placing two dumbbells on one side of a flat bench.", "Kneel down on both of your knees so that your body is facing the flat bench.", "Use your arms to grab both of the dumbbells with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.", "Start out by curling your wrist upwards and exhaling."], "Single-leg extension": ["Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee. Select a weight appropriate for your abilities.", "Maintaining good posture, fully extend one leg, pausing at the top of the motion.", "Return to the starting position without letting the weight stop, keeping tension on the muscle.", "Repeat for the desired number of repetitions."], "Narrow-stance leg press": ["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a less-than-shoulder-width narrow stance with the toes slightly pointed out. Your feet should be around 3 inches or less apart. Tip: Keep your head up at all times and also maintain the back on the pad at all times.", "Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.", "As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.", "Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale."], "Standing leg curl": ["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.", "Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.", "As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.", "As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."], "Dumbbell calf raise": ["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.", "With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.", "As you inhale, go back to the starting position by slowly lowering the heels.", "Repeat for the recommended amount of times."], "Machine military press": ["Sit down on the Shoulder Press Machine and select the weight.", "Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.", "Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.", "Lower the handles slowly back to the starting position as you inhale."], "Seated cable shoulder press": ["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees. This will be your starting position.", "Begin by extending through the elbow, pressing the handles together above your head.", "After pausing at the top, return the handles to the starting position. Ensure that you maintain tension on the cables.", "You can also execute this movement with your back off the pad and alternate hands."], "Dumbbell shoulder press": ["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.", "Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.", "Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.", "Now, exhale and push the dumbbells upward until they touch at the top."], "Smith machine upright row": ["To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart. You may need some wrist wraps if using a significant amount of weight.", "Lift the barbell up and fully extend your arms with your back straight. There should be a slight bend at the elbows. This is the starting position.", "Use your side shoulders to lift the bar as you exhale. The bar should be close to the body as you move it up. Continue to lift it until it nearly touches your chin. Tip: Your elbows should drive the motion. As you lift the bar, your elbows should always be higher than your forearms. Also, keep your torso stationary and pause for a second at the top of the movement.", "Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement."], "Dumbbell lateral raise": ["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.", "While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.", "Lower the dumbbells back down slowly to the starting position as you inhale.", "Repeat for the recommended amount of repetitions."], "Cable lateral raise (two-handle)": ["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.", "Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.", "Bend forward while keeping your back flat and rest your torso on the thighs.", "Have someone give you l your shoulders off the floor.", "Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum."], "Standing rope crunch": ["Attach a rope to a high pulley and select an appropriate weight.", "Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest. This will be your starting position.", "Perform the movement by flexing the spine, crunching the weight down as far as you can.", "Hold the peak contraction for a moment before returning to the starting position."], "Flat bench leg raise": ["Lie with your back flat on a bench and your legs extended in front of you off the end.", "Place your hands either under your glutes with your palms down or by the sides holding on to the bench. This will be your starting position.", "As you keep your legs extended, straight as possible with your knees slightly bent but locked raise your legs until they make a 90-degree angle with the floor. Exhale as you perform this portion of the movement and hold the contraction at the top for a second.", "Now, as you inhale, slowly lower your legs back down to the starting position."], "Hanging leg raise": ["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.", "Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.", "Go back slowly to the starting position as you breathe in.", "Repeat for the recommended amount of repetitions."], "Oblique crunch": ["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put one hand beside your head and the other to the side against the floor.", "Make sure your feet are elevated and resting on a flat surface.", "Now lift the shoulder in which your hand is touching your head.", "Simply elevate your shoulder and body upward until you touch your knee. For example, if you have your right hand besides your head, then you want to elevate your body upwards until your right elbow touches your left knee. The same variation can be applied doing the inverse and using your left elbow to touch your right knee."], "Cable Russian twist": ["Connect a standard handle attachment, and position the cable to a middle pulley position.", "Lie on a stability ball perpendicular to the cable and grab the handle with one hand. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.", "Grab the handle with both hands and fully extend your arms above your chest. You hands should be directly in-line with the pulley. If not, adjust the pulley up or down until they are.", "Keep your hips elevated and abs engaged. Rotate your torso away from the pulley for a full-quarter rotation. Your body should be flat from head to knees."]};
